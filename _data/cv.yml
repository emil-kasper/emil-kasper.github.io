      - name: "Asking Your Advisor: Learning When to Consult Stronger Models in Agentic Systems"
        summary: "Submitted to ICLR 2027. We train a meta-policy that learns when to consult a stronger advisor model and when to continue with a cheaper one, reaching a better success-cost Pareto frontier than standard advisor-executor setups. Preprint on [arXiv](https://arxiv.org/abs/2610.13870)."

